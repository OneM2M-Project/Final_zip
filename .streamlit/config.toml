# Dashboard theme. Applied when run_all.py or streamlit run is started from the project root.
[theme]
base = "light"
primaryColor = "#dc2626"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
