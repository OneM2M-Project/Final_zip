; VS Code PlatformIO: 이 arduino/ 폴더를 PlatformIO로 열거나, 루트에서 "pio run -d arduino -t upload"
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
    arduino-libraries/Servo@^1.2.1
; upload_port = COM3
