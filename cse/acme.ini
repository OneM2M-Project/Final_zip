;
;   ACME settings for the X-Guard MN-CSE
;   Run:  cd cse, then acmecse --headless   (or plain acmecse for the text UI)
;   cse/ is ACME's base directory, so cse/init/xguard.fcp is loaded automatically.
;

[basic.config]
cseType=MN
cseID=id-mn
cseName=cse-mn
adminID=CAdmin
serviceProviderID=//xguard.alom
networkInterface=0.0.0.0
; This PC's IP as reached from other machines (the AI pod on the VM). http.address follows it.
cseHost=127.0.0.1
httpPort=8080
; ---- IN-CSE (fill in once it's decided, was due 11/6) ----
; Mobius4 example: registrarCseHost=<IN_IP> registrarCsePort=7579 registrarCseID=id-in registrarCseName=Mobius
registrarCseHost=127.0.0.1
registrarCsePort=7580
registrarCseID=id-in
registrarCseName=cse-in
logLevel=info
databaseType=tinydb

[cse]
; Leave false until there is an IN-CSE to register with, then set true.
enableRemoteCSE=false
; Other defaults left alone so notifications use structured 'cse-mn/...' paths inside the MN-CSE.

[cse.security]
; Can be false for testing before setup_resources.py acp has run. Normally true.
enableACPChecks=true

[cse.registration]
allowedAEOriginators=C*,S*,/*/C*,/*/S*

[http]
enable=true
port=${basic.config:httpPort}
address=http://${basic.config:cseHost}:${basic.config:httpPort}

[mqtt]
; gateway.py (LineSensor-01, Rejector-01) talks to the CSE over MQTT.
enable=true
address=127.0.0.1
port=1883

[database]
type=${basic.config:databaseType}
; For a clean start before a demo: acmecse --db-reset
resetOnStartup=false

[webui]
enable=true

[console]
headless=False
