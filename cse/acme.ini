;
;   X-Guard MN-CSE (ACME) 설정
;   실행:  cd cse   그리고   acmecse --headless   (또는 그냥 acmecse 로 텍스트 UI)
;   이 폴더(cse/)가 ACME의 base directory 이고, cse/init/xguard.fcp 를 자동으로 읽어요.
;

[basic.config]
cseType=MN
cseID=id-mn
cseName=cse-mn
adminID=CAdmin
serviceProviderID=//xguard.alom
networkInterface=0.0.0.0
; 다른 기기(VM의 AI Pod)가 접속할 이 PC의 IP. 바꾸면 http.address 도 함께 바뀌어요.
cseHost=127.0.0.1
httpPort=8080
; ---- IN-CSE (11/6 결정 후 수정) ----
; Mobius4 예: registrarCseHost=<IN_IP> registrarCsePort=7579 registrarCseID=id-in registrarCseName=Mobius
registrarCseHost=127.0.0.1
registrarCsePort=7580
registrarCseID=id-in
registrarCseName=cse-in
logLevel=info
databaseType=tinydb

[cse]
; IN-CSE가 아직 없으면 false 로 두고 시험하세요. IN-CSE가 준비되면 true.
enableRemoteCSE=false
; 구독 알림이 MN-CSE 안에서 'cse-mn/...' 구조 경로로 동작하도록 기본값 유지

[cse.security]
; setup_resources.py acp 단계 전에는 false 로 두어도 돼요(시험 편의). 기본은 true.
enableACPChecks=true

[cse.registration]
allowedAEOriginators=C*,S*,/*/C*,/*/S*

[http]
enable=true
port=${basic.config:httpPort}
address=http://${basic.config:cseHost}:${basic.config:httpPort}

[mqtt]
; gateway.py(LineSensor-01, Rejector-01)는 MQTT로 요청/알림을 주고받아요.
enable=true
address=127.0.0.1
port=1883

[database]
type=${basic.config:databaseType}
; 시연 전 깨끗하게: acmecse --db-reset
resetOnStartup=false

[webui]
enable=true

[console]
headless=False
